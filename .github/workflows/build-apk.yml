name: 构建安卓 APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: 编译 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 SDK platform 35 / build-tools 35
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes 2>/dev/null | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0" || sdkmanager --install "build-tools;35.0.1"

      - name: 安装 npm 依赖
        run: npm install

      - name: 生成 Android 工程
        run: npx cap add android

      - name: 生成应用图标
        continue-on-error: true
        run: |
          npx @capacitor/assets generate --android \
            --iconForeground www/icons/icon-foreground.png \
            --iconBackground www/icons/icon-background.png \
            --icon www/icons/icon.png \
            --iconBackgroundColor '#8D5E2F' \
            --iconBackgroundColorDark '#8D5E2F'

      - name: 同步网页资源
        run: npx cap sync android

      - name: 编译 Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 制品
        uses: actions/upload-artifact@v4
        with:
          name: xiangqi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 打 tag 时发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
